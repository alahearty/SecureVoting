name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/SecureVoting.slnx
      - name: Build
        run: dotnet build backend/SecureVoting.slnx -c Release --no-restore
      - name: Test
        run: dotnet test backend/SecureVoting.slnx -c Release --no-build --logger "console;verbosity=minimal"

  frontend:
    name: Frontend typecheck, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Playwright election flow
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create disposable compose environment
        run: |
          printf '%s\n' \
            'POSTGRES_PASSWORD=ci-securevote-password' \
            'SEED_ENABLED=true' \
            'SEED_DEMO_PASSWORD=DemoPass!2026Secure' \
            'ASPNETCORE_ENVIRONMENT=Development' \
            'FRONTEND_BASE_URL=http://localhost:8080' \
            'API_PORT=8080' \
            'EMAIL_ENABLED=false' > .env
      - name: Start application stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright
        env:
          SECUREVOTE_E2E_URL: http://localhost:8080
        run: npx playwright test --project=chromium
        working-directory: frontend
      - name: Stop stack
        if: always()
        run: docker compose down -v
