services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: securevote
      POSTGRES_USER: securevote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - securevote-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevote -d securevote"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=securevote;Username=securevote;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UserName: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM:-}
      RateLimit__LoginPermitLimit: ${RATE_LIMIT_LOGIN:-10}
      RateLimit__BallotPermitLimit: ${RATE_LIMIT_BALLOT:-10}
      DataProtection__KeysPath: /data/keys
      Storage__CandidatePhotosPath: /data/photos
      Security__UseHttpsRedirection: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - securevote-appdata:/data
    restart: unless-stopped

volumes:
  securevote-pgdata:
  securevote-appdata:
